default: &default
  adapter: postgresql
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
development:
  <<: *default
  database: notifications_development
test:
  <<: *default
  database: notifications_test
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
